server:
  port: 8081
spring:
  application:
    name: "ApplicationsService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
    url: jdbc:postgresql://localhost:5432/application_service_db
    user: ivan
    password: ivan123
    default-schema: public
adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: application_service_db
    schema: public
    username: ivan
    password: ivan123
  user-service:
    base-url: http://localhost:8080
    timeout: 3s
  webclient:
    connection-timeout: 1000
    read-timeout: 3000
    write-timeout: 3000
    max-memory-size: 1048576
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
